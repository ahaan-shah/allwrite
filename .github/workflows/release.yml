name: Release

# Push a tag like v0.1.0 to build and publish a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 24.04 sets the glibc baseline (2.39), so the binaries run on
          # current Arch, Fedora, Debian 13 and Ubuntu 24.04+.
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev rpm
      - run: npm ci
      - run: npm test
      # Builds the frontend, the release binary, and the .deb / .rpm packages.
      - run: npx tauri build --bundles deb,rpm

      - name: Package
        run: |
          tag="${GITHUB_REF_NAME}"
          name="allwrite-${tag}-${{ matrix.arch }}-linux"
          mkdir -p "out/$name"
          cp src-tauri/target/release/allwrite "out/$name/"
          cp packaging/allwrite.desktop README.md LICENSE "out/$name/"
          cp logos/markdown-reader-blue.svg "out/$name/allwrite.svg"
          tar -C out -czf "out/$name.tar.gz" "$name"
          cp src-tauri/target/release/bundle/deb/*.deb out/
          cp src-tauri/target/release/bundle/rpm/*.rpm out/
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}
          path: |
            out/*.tar.gz
            out/*.deb
            out/*.rpm
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Checksums
        run: cd files && sha256sum * > checksums.txt && cat checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" files/* --repo "$GITHUB_REPOSITORY" \
            --title "allwrite ${tag}" --generate-notes
